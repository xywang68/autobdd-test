# run test only
# docker-compose run --rm autobdd-test-run "xvfb-runner.sh make test-all"
#
# test development
# docker-compose up -d autobdd-test-dev
# docker-compose logs -f autobdd-test-dev
# ssh -o StrictHostKeyChecking=no $USER@localhost -p 2224
# default password is "ubuntu"
# in container ssh: make test-all
# vnc localhost:5924
# docker-compose down
#
# DEV-MODE: mount the working-tree AutoBDD framework over the image's baked copy so
# autobdd-test runs against live AutoBDD source (phase-0) instead of the stale image.
# AUTOBDD_SRC defaults to the sibling ../AutoBDD directory. Set it explicitly to point
# at your checkout:  AUTOBDD_SRC=/abs/path/to/AutoBDD docker-compose up ...
version: '2.4'
services:

  # dev container for developing autobdd test
  autobdd-test-dev:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-test-dev
    shm_size: 512M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${AUTOBDD_SRC:-../AutoBDD}:/home/${USER}/Projects/AutoBDD:rw
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:rw
    ports:
      - "5924:5900"
      - "2224:22"
      - "8004:8000"
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
      - PASSWORD=${PASSWORD}
      - VNC_PASSWORD=${VNC_PASSWORD}
      - RESOLUTION=1920x1200x24
    entrypoint: "/root/autobdd-dev.startup.sh"

  # run container for running autobdd test
  autobdd-test-run:
    image: "xyteam/autobdd:${AutoBDD_Ver}"
    container_name: autobdd-test-run
    shm_size: 512M
    user: root
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ${AUTOBDD_SRC:-../AutoBDD}:/home/${USER}/Projects/AutoBDD:rw
      - ${PWD}:/home/${USER}/Projects/AutoBDD/test-projects/${ABDD_PROJECT}:rw
    environment:
      - USER=${USER}
      - ABDD_PROJECT=${ABDD_PROJECT}
      - HOSTOS=${HOSTOS}
      - USERID=${USERID}
      - GROUPID=${GROUPID}
    entrypoint: "/root/autobdd-run.startup.sh"
